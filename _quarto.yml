project:
  type: website
  output-dir: docs

resources:
  - www/js/**
  - footer.js

website:
  title: "Blog Fortec"
  page-footer:
    border: false
    background: none
    center: |
      <div class="footer-custom">
        <img src="/quarto-logo.png" alt="Logotipo Quarto" height="24" style="vertical-align:middle; margin-right:8px;" />
        © <span id="anoAtual"></span> C. A. C. Barros · 
        <a href="https://quarto.org" target="_blank">Quarto</a> · 
        <a href="https://github.com/cacbarros/blog-fortec" target="_blank">GitHub</a><br>
        <small>Atualizado em: <span id="dataModificacao"></span></small>
      </div>

  navbar:
    left:
      - text: "🔢 Matemática"
        menu:
      
          - text: "📘 Matemática 10.º"
            href: posts/matematica/matematica10/
          - text: "📗 Matemática 11.º"
            href: posts/matematica/matematica11/
          - text: "📙 Matemática 12.º"
            href: posts/matematica/matematica12/
          - text: "🧮 Álgebra"
            href: posts/matematica/algebra/
          - text: "📐 Cálculo"
            href: posts/matematica/calculo/
          - text: "➗ Séries Matemáticas"
            href: posts/matematica/series/

      - text: "⚗️ Física e Química"
        menu:
          - text: "⚙️ Física"
            href: posts/fisica/
          - text: "🧪 Química"
            href: posts/quimica/
          - text: "🌡️ Termodinâmica"
            href: posts/termodinamica/

      - text: "🛠️ Aplicações"
        menu:
          - text: "🌬️ Climatização"
            href: posts/climatizacao/
          - text: "🎮 Jogos"
            href: posts/jogos/index.qmd

      - text: "🧭 Diversos"
        menu:
          - text: "🎨 História da Arte"
            href: posts/diversos/artes/
          - text: "📚 Educação e Pedagogia"
            href: posts/diversos/educacao/
          - text: "🌍 Cultura e Sociedade"
            href: posts/diversos/cultura/
          - text: "🧘 Bem-estar e Estilo de Vida"
            href: posts/diversos/bem-estar/
  

    right:
      - text: "ℹ️ Sobre"
        href: sobre.qmd
      - text: "🏠 Início"
        href: index.qmd
format:
  html:
    theme: flatly
    css: styles.css
    includes:
      in-header: include/head.html
    include-before-body:
      - text: '<script src="/footer.js"></script>'
    toc: true

filters:
  - watermark

watermark:
  text: "{{< meta rascunho_text >}}"
  size: 1.5
  angle: 30
  color: "#FF0000"
  opacity: 0.1
  enabled: "{{< meta rascunho >}}"
